version: '3.8'

services:
  mopsa-wasm-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: 1000
        USER_GID: 1000
    image: mopsa-wasm-dev:latest
    container_name: mopsa-wasm-dev
    user: vscode
    working_dir: /workspace
    volumes:
      # Mount the entire project directory
      - .:/workspace:cached
      # Persist opam packages across container restarts
      - opam-cache:/home/vscode/.opam
    environment:
      - OPAMROOT=/home/vscode/.opam
      - PATH=/home/vscode/.opam/4.12.0/bin:/opt/emsdk:/opt/emsdk/upstream/emscripten:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  opam-cache:

